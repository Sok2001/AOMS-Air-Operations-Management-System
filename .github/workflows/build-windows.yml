name: Build AOMS Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build AOMS executable
        shell: pwsh
        run: |
          $buildArgs = @(
            "--noconfirm",
            "--clean",
            "--windowed",
            "--onefile",
            "--name", "AOMS",
            "--add-data", "assets;assets",
            "--add-data", "data;data",
            "--collect-all", "customtkinter",
            "--collect-all", "darkdetect",
            "--collect-all", "fitz",
            "main.py"
          )

          python -m PyInstaller @buildArgs

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $iscc)) {
              throw "Inno Setup compiler not found."
          }

          & $iscc "installer\AOMS.iss"

          if (!(Test-Path "dist\AOMS-Setup.exe")) {
              throw "AOMS installer was not created."
          }

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: AOMS-Windows-Installer
          path: dist/AOMS-Setup.exe
          if-no-files-found: error
